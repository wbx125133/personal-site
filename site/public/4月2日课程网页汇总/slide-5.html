<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>泛化与涌现能力 — LLM与Prompt工程</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-slide="5" data-total="12">
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<main class="slide">
<div class="slide-inner slide-content">

<div class="tag reveal">模块二 · 能力边界</div>
<h1 class="reveal d1 slide-title">大模型的核心能力</h1>
<p class="subtitle reveal d2">泛化能力与涌现能力的协同效应</p>
<div class="grid-2 reveal d3" style="gap:32px">
  <div class="card card-accent blue">
    <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#60a5fa);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:20px">🔄</div>
    <h2 style="color:var(--blue-l)">泛化能力</h2>
    <p style="margin:12px 0 20px">从大量数据中抽象出通用知识，遇到类似但未见过的任务时，能有效迁移应用，解决新问题。</p>
    <div style="height:1px;background:var(--border);margin-bottom:16px"></div>
    <ul style="list-style:none;display:flex;flex-direction:column;gap:10px">
      <li style="display:flex;align-items:center;gap:10px;font-size:0.85rem;color:var(--c2)"><span style="width:6px;height:6px;border-radius:2px;background:var(--blue);flex-shrink:0"></span>跨领域知识迁移</li>
      <li style="display:flex;align-items:center;gap:10px;font-size:0.85rem;color:var(--c2)"><span style="width:6px;height:6px;border-radius:2px;background:var(--blue);flex-shrink:0"></span>未见任务的适应能力</li>
      <li style="display:flex;align-items:center;gap:10px;font-size:0.85rem;color:var(--c2)"><span style="width:6px;height:6px;border-radius:2px;background:var(--blue);flex-shrink:0"></span>抽象模式识别</li>
    </ul>
  </div>
  <div class="card card-accent purple">
    <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:20px">✨</div>
    <h2 style="color:var(--purple-l)">涌现能力</h2>
    <p style="margin:12px 0 20px">当参数量突破一定规模临界点，大模型表现出全新的智能，解决之前完全无法解决的困难问题。</p>
    <div style="height:1px;background:var(--border);margin-bottom:16px"></div>
    <ul style="list-style:none;display:flex;flex-direction:column;gap:10px">
      <li style="display:flex;align-items:center;gap:10px;font-size:0.85rem;color:var(--c2)"><span style="width:6px;height:6px;border-radius:2px;background:var(--purple);flex-shrink:0"></span>参数规模突破临界点</li>
      <li style="display:flex;align-items:center;gap:10px;font-size:0.85rem;color:var(--c2)"><span style="width:6px;height:6px;border-radius:2px;background:var(--purple);flex-shrink:0"></span>质变而非渐进式提升</li>
      <li style="display:flex;align-items:center;gap:10px;font-size:0.85rem;color:var(--c2)"><span style="width:6px;height:6px;border-radius:2px;background:var(--purple);flex-shrink:0"></span>不可预测的新能力</li>
    </ul>
  </div>
</div>

</div>
</main>
<script src="nav.js"></script>
</body>
</html>
