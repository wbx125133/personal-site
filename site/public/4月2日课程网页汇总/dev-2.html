<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>需求管理与AI工作规范 — AI产品开发</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-slide="2" data-total="6">
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<main class="slide">
<div class="slide-inner slide-content">

<div class="tag tag-amber reveal">AI 产品开发模块</div>
<h1 class="reveal d1 slide-title">需求管理与 AI 工作规范</h1>
<p class="subtitle reveal d2">建立规范化的 AI 产品需求与提示词体系</p>

<div class="card reveal d3" style="margin-bottom:24px;border-color:rgba(139,92,246,0.2)">
  <h2 style="margin-bottom:16px">📝 AI 提示词规范</h2>
  <p style="font-size:0.85rem;color:var(--c2);margin-bottom:16px">在 AI 协作中使用规范化话术，确保输出质量与可追溯性</p>
  <div class="grid-2" style="gap:12px">
    <div class="code-block" style="font-size:0.82rem"><span class="label">话术示例</span>请引用权威性来源来回答这个问题</div>
    <div class="code-block" style="font-size:0.82rem"><span class="label">话术示例</span>请给出出处和参考依据</div>
  </div>
</div>

<h2 class="reveal d3" style="margin-bottom:16px">需求管理三要素</h2>
<div class="grid-3 reveal d3" style="gap:20px">
  <div class="card card-accent purple">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div class="phase-num purple" style="margin:0;width:40px;height:40px;min-width:40px;font-size:0.9rem">1</div>
      <h2 style="color:var(--purple-l)">需求来源</h2>
    </div>
    <ul style="list-style:none;display:flex;flex-direction:column;gap:10px;font-size:0.85rem;color:var(--c2)">
      <li style="display:flex;align-items:center;gap:8px"><span class="badge badge-purple">问卷</span> 用户调研问卷</li>
      <li style="display:flex;align-items:center;gap:8px"><span class="badge badge-purple">反馈</span> 用户意见收集</li>
      <li style="display:flex;align-items:center;gap:8px"><span class="badge badge-purple">调研</span> 市场竞品分析</li>
    </ul>
  </div>
  <div class="card card-accent blue">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div class="phase-num blue" style="margin:0;width:40px;height:40px;min-width:40px;font-size:0.9rem">2</div>
      <h2 style="color:var(--blue-l)">数据支撑</h2>
    </div>
    <ul style="list-style:none;display:flex;flex-direction:column;gap:10px;font-size:0.85rem;color:var(--c2)">
      <li style="display:flex;align-items:center;gap:8px"><span class="badge badge-blue">埋点</span> 数据埋点采集</li>
      <li style="display:flex;align-items:center;gap:8px"><span class="badge badge-blue">看板</span> 数据看板监控</li>
      <li style="display:flex;align-items:center;gap:8px"><span class="badge badge-blue">归因</span> 问题归因分析</li>
    </ul>
  </div>
  <div class="card card-accent cyan">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div class="phase-num cyan" style="margin:0;width:40px;height:40px;min-width:40px;font-size:0.9rem">3</div>
      <h2 style="color:var(--cyan-l)">工具支持</h2>
    </div>
    <ul style="list-style:none;display:flex;flex-direction:column;gap:10px;font-size:0.85rem;color:var(--c2)">
      <li style="display:flex;align-items:center;gap:8px"><span class="badge badge-cyan">需求池</span> 统一管理需求</li>
      <li style="display:flex;align-items:center;gap:8px"><span class="badge badge-cyan">文档</span> 本地/在线文档</li>
      <li style="display:flex;align-items:center;gap:8px"><span class="badge badge-cyan">项目</span> 项目管理工具</li>
    </ul>
  </div>
</div>

</div>
</main>
<script src="dev-nav.js"></script>
</body>
</html>
