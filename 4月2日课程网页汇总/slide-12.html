<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四象限应用 — LLM与Prompt工程</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-slide="12" data-total="12">
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<main class="slide">
<div class="slide-inner slide-content">

<div class="tag reveal">模块四 · 人机协作</div>
<h1 class="reveal d1 slide-title">AI协作四象限</h1>
<p class="subtitle reveal d2">我 × AI 的知识交叉矩阵</p>
<div class="reveal d3" style="text-align:center">
  <div style="display:flex;justify-content:space-between;max-width:720px;margin:0 auto"><span class="axis-label">← 我不知道</span><span class="axis-label">我知道 →</span></div>
  <div style="display:flex;align-items:center;max-width:760px;margin:0 auto">
    <span class="axis-label" style="writing-mode:vertical-lr;transform:rotate(180deg);margin-right:8px">AI知道 ↑ &nbsp;&nbsp;&nbsp; ↓ AI不知道</span>
    <div class="axis-matrix" style="flex:1">
      <div class="q-cell q1" style="text-align:center;padding:clamp(24px,3vw,40px)">
        <span class="q-icon">📖</span>
        <div class="q-title" style="color:var(--purple-l)">学习</div>
        <div class="q-sub">如何提问？</div>
      </div>
      <div class="q-cell q2" style="text-align:center;padding:clamp(24px,3vw,40px);background:rgba(59,130,246,0.08)">
        <span class="q-icon">🤖</span>
        <div class="q-title" style="color:var(--blue-l)">助理</div>
        <div class="q-sub">如何下发指令？</div>
      </div>
      <div class="q-cell q3" style="text-align:center;padding:clamp(24px,3vw,40px);background:rgba(6,182,212,0.08)">
        <span class="q-icon">🤝</span>
        <div class="q-title" style="color:var(--cyan-l)">共创</div>
        <div class="q-sub">如何协作？</div>
      </div>
      <div class="q-cell q4" style="text-align:center;padding:clamp(24px,3vw,40px);background:rgba(16,185,129,0.08)">
        <span class="q-icon">📝</span>
        <div class="q-title" style="color:var(--green-l)">投喂</div>
        <div class="q-sub">如何引导？</div>
      </div>
    </div>
  </div>
</div>

</div>
</main>
<script src="nav.js"></script>
</body>
</html>
