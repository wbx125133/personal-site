<div class="card reveal d3" style="margin-bottom:24px;border-color:rgba(139,92,246,0.2)">

  <div class="grid-3" style="gap:12px;margin-bottom:20px">
    <div style="padding:16px;border-radius:10px;background:rgba(139,92,246,0.06);border:1px solid rgba(139,92,246,0.15);text-align:center">
      <span style="font-size:1.5rem">📚</span>
      <p style="font-size:0.88rem;font-weight:600;color:var(--purple-l);margin-top:8px">海量数据</p>
    </div>
    <div style="padding:16px;border-radius:10px;background:rgba(59,130,246,0.06);border:1px solid rgba(59,130,246,0.15);text-align:center">
      <span style="font-size:1.5rem">🏗️</span>
      <p style="font-size:0.88rem;font-weight:600;color:var(--blue-l);margin-top:8px">低秩模型</p>
    </div>
    <div style="padding:16px;border-radius:10px;background:rgba(6,182,212,0.06);border:1px solid rgba(6,182,212,0.15);text-align:center">

      <p style="font-size:0.88rem;font-weight:600;color:var(--cyan-l);margin-top:8px">算法</p>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:16px">

  <div style="text-align:center;padding:12px;border-radius:10px;background:var(--surface-1);font-size:0.82rem;color:var(--c2)"><strong style="color:var(--blue-l)">划定重点</strong></div>

  <p style="font-size:0.85rem;color:var(--c2)">💡 核心逻辑：将用户问题<strong style="color:var(--green-l)">"分解"为模型可理解的词元（Token）</strong>，再通过向量化完成语义理解与回答生成</p>
