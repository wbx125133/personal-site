<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品基础与核心视角 — AI产品经理基础</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-slide="1" data-total="7">
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<main class="slide">
<div class="slide-inner slide-content">

<div class="tag tag-green reveal">AI 产品经理基础 · 产品视角</div>
<h1 class="reveal d1 slide-title">产品基础与核心视角</h1>
<p class="subtitle reveal d2">理解用户、痛点、场景三要素，掌握视角切换能力</p>

<h2 class="reveal d3" style="margin-bottom:16px">🎯 产品三要素</h2>
<div class="grid-3 reveal d3" style="gap:16px;margin-bottom:24px">
  <div class="card card-accent purple" style="text-align:center">
    <div style="font-size:2rem;margin-bottom:8px">👤</div>
    <h2 style="color:var(--purple-l);margin-bottom:8px">用户</h2>
    <p style="font-size:0.82rem;color:var(--c3)">产品服务的核心对象，一切需求的出发点</p>
  </div>
  <div class="card card-accent rose" style="text-align:center">
    <div style="font-size:2rem;margin-bottom:8px">💢</div>
    <h2 style="color:var(--rose-l);margin-bottom:8px">痛点</h2>
    <p style="font-size:0.82rem;color:var(--c3)">用户在特定场景中遇到的真实问题与障碍</p>
  </div>
  <div class="card card-accent cyan" style="text-align:center">
    <div style="font-size:2rem;margin-bottom:8px">🎬</div>
    <h2 style="color:var(--cyan-l);margin-bottom:8px">场景</h2>
    <p style="font-size:0.82rem;color:var(--c3)">痛点发生的具体环境与上下文条件</p>
  </div>
</div>

<div class="card reveal d4" style="margin-bottom:28px;border-color:rgba(16,185,129,0.25)">
  <h2 style="font-size:0.88rem;margin-bottom:10px;color:var(--green-l)">🔗 核心逻辑关系</h2>
  <div style="display:flex;align-items:center;gap:0;flex-wrap:wrap">
    <div class="flow-node" style="font-size:0.82rem;padding:12px 18px">🎬 场景</div>
    <div class="connector-line" style="min-width:24px;flex:0 0 24px"></div>
    <div class="flow-node" style="font-size:0.82rem;padding:12px 18px">💢 痛点</div>
    <div class="connector-line" style="min-width:24px;flex:0 0 24px"></div>
    <div class="flow-node accent" style="font-size:0.82rem;padding:12px 18px">👤 用户真实需求</div>
  </div>
  <p style="font-size:0.8rem;color:var(--c4);margin-top:12px">痛点来源于场景，二者共同指向用户的真实需求</p>
</div>

<h2 class="reveal d5" style="margin-bottom:16px">🔄 三大核心视角转换</h2>
<table class="styled-table reveal d5">
  <thead>
    <tr><th>视角类型</th><th>核心关注重点</th></tr>
  </thead>
  <tbody>
    <tr><td><strong style="color:var(--purple-l)">👤 用户视角</strong></td><td>产品体验 — 好不好用、是否解决问题</td></tr>
    <tr><td><strong style="color:var(--blue-l)">📦 产品视角</strong></td><td>业务逻辑 — 功能完整性、技术可行性</td></tr>
    <tr><td><strong style="color:var(--amber-l)">💰 商业视角</strong></td><td>商业收益 — 变现模式、增长空间</td></tr>
  </tbody>
</table>

</div>
</main>
<script src="intro-nav.js"></script>
</body>
</html>
